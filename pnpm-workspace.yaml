overrides:
  '@types/react': 19.2.10
  '@types/react-dom': 19.2.3

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: false
  unrs-resolver: false

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - prisma
  - protobufjs

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
