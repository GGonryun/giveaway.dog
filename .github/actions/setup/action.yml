name: Setup
description: Install pnpm, Node.js, and the project dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm 10 (the version that Vercel builds with)
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/*/node_modules
          packages/*/*/*/node_modules
          tools/*/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node-${{ hashFiles('.nvmrc') }}-modules-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/infra/db-schema/src/schema.prisma') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
