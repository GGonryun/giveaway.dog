name: Setup
description: Install pnpm, Node.js, and the project dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm 10 (the version that Vercel builds with)
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
