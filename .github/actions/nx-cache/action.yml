name: Nx cache
description: Keep the Nx cache between CI runs. A local server gives the cache to Nx through the Nx remote cache API. This action restores the files of the server, and the job saves them with actions/cache/save and the key output

inputs:
  id:
    description: The part of the cache key that tells the jobs apart
    default: ${{ github.job }}

outputs:
  key:
    description: The key to save the cache with
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: true when the cache of this exact commit was restored
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore the Nx cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: .nx/ci-cache
        key: nx-${{ runner.os }}-${{ inputs.id }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ inputs.id }}-${{ github.head_ref || github.ref_name }}-
          nx-${{ runner.os }}-${{ inputs.id }}-main-

    - name: Start the Nx cache server
      shell: bash
      run: |
        log="$RUNNER_TEMP/nx-cache-server.log"
        nohup node "$GITHUB_ACTION_PATH/server.mjs" .nx/ci-cache 7373 > "$log" 2>&1 &
        for _ in $(seq 50); do
          grep -q 'Listening' "$log" && break
          sleep 0.1
        done
        cat "$log"
        grep -q 'Listening' "$log"
        echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:7373" >> "$GITHUB_ENV"
