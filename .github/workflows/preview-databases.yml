name: Preview databases

on:
  pull_request_target:
    types: [closed]
  delete:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: Delete the database branch of this git branch. Leave empty to delete every database branch that is older than 7 days and whose git branch has no open pull request
        required: false
        default: ''
      dry_run:
        description: Only list the database branches to delete
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-databases
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete preview database branches
    if: >-
      (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check the secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          failed=0
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error::Add the NEON_API_KEY secret in Settings > Secrets and variables > Actions > Secrets."
            failed=1
          fi
          if [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Add the NEON_PROJECT_ID variable in Settings > Secrets and variables > Actions > Variables."
            failed=1
          fi
          exit $failed

      - name: Check out the script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/scripts/neon-preview-branches.mjs
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Delete the database branches
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_BRANCH: ${{ github.event.pull_request.head.ref }}
          DELETED_BRANCH: ${{ github.event.ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          script=.github/scripts/neon-preview-branches.mjs
          case "$EVENT" in
            pull_request_target) node "$script" delete "$PULL_REQUEST_BRANCH" ;;
            delete) node "$script" delete "$DELETED_BRANCH" ;;
            workflow_dispatch)
              if [ -n "$INPUT_BRANCH" ]; then
                node "$script" delete "$INPUT_BRANCH" $DRY_RUN
              else
                node "$script" sweep $DRY_RUN
              fi
              ;;
            *) node "$script" sweep ;;
          esac
