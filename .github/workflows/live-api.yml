name: Live API checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      packages:
        description: The packages to check, comma-separated (for example x-scraper,twitch-api). Empty checks every package with live checks
        type: string
        default: ''
      record:
        description: Record the responses (tokens, secrets, passwords and emails redacted) in the live-api-recordings artifacts
        type: boolean
        default: false

permissions:
  contents: read

env:
  NX_NO_CLOUD: true

jobs:
  plan:
    name: Pick the live checks
    if: github.event.action != 'labeled' || github.event.label.name == 'live-api'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-plan-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick the packages whose live checks reach a changed file
        id: plan
        env:
          LIVE_RUN_ALL: ${{ github.event_name != 'pull_request' }}
          LIVE_PACKAGES: ${{ inputs.packages }}
          LIVE_BASE: ${{ github.event.action == 'synchronize' && github.event.before || 'HEAD^1' }}
          LIVE_HEAD: ${{ github.event.action == 'synchronize' && github.event.after || 'HEAD' }}
          LIVE_FALLBACK_BASE: HEAD^1
        run: node .github/scripts/live-api-plan.mjs

  live:
    name: Live API checks (${{ matrix.package }})
    needs: plan
    if: needs.plan.outputs.packages != '' && needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.packages) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.package }}
      cancel-in-progress: true
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Call the provider
        env:
          SCRAPEBADGER_API_KEY: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'live-api')) && secrets.LIVE_SCRAPEBADGER_API_KEY || '' }}
          TWITCH_CLIENT_ID: ${{ secrets.LIVE_TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.LIVE_TWITCH_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.LIVE_DISCORD_BOT_TOKEN }}
          LIVE_X_TWEET_URL: ${{ vars.LIVE_X_TWEET_URL }}
          LIVE_BLUESKY_POST_URL: ${{ vars.LIVE_BLUESKY_POST_URL }}
          LIVE_TWITCH_LOGIN: ${{ vars.LIVE_TWITCH_LOGIN }}
          LIVE_DISCORD_GUILD_ID: ${{ vars.LIVE_DISCORD_GUILD_ID }}
          LIVE_RECORD_DIR: ${{ inputs.record && format('{0}/live-recordings', runner.temp) || '' }}
          PACKAGE: ${{ matrix.package }}
        run: pnpm nx run "$PACKAGE:test:live" --output-style=static

      - name: Name the recordings artifact
        id: artifact
        if: always() && inputs.record
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "name=live-api-recordings-${PACKAGE#@giveaway/}" >> "$GITHUB_OUTPUT"

      - name: Upload the recorded responses
        if: always() && inputs.record
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/live-recordings
          if-no-files-found: warn
          retention-days: 1
