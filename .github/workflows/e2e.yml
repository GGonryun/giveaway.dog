name: E2E

on:
  workflow_call:
    inputs:
      sha:
        description: Commit whose preview deployment to test
        required: true
        type: string
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      E2E_LOGIN_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      url:
        description: URL of the preview deployment to test
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      SHA: ${{ inputs.sha || github.sha }}
      DEPLOYMENT_URL: ${{ inputs.url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the deployment and the secrets
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_LOGIN_SECRET: ${{ secrets.E2E_LOGIN_SECRET }}
        run: |
          failed=0
          if [ -z "$SHA" ]; then
            echo "::error::No commit to test."
            failed=1
          fi
          for name in VERCEL_AUTOMATION_BYPASS_SECRET E2E_LOGIN_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret in Settings > Secrets and variables > Actions."
              failed=1
            fi
          done
          exit $failed

      - name: Report a pending status on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            description='Testing the preview deployment'
          else
            description='Waiting for the preview deployment'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context='E2E tests' \
            -f description="$description" \
            -f target_url="$RUN_URL"

      - name: Check out the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: ${{ inputs.url && '1' || '0' }}
          persist-credentials: false

      - name: Check out the scripts of the workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .e2e-workflow
          sparse-checkout: |
            .github/scripts/same-app-preview.sh
            .github/scripts/e2e-summary.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pick the deployment to test
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            url="$DEPLOYMENT_URL"
          else
            url=$(bash .e2e-workflow/.github/scripts/same-app-preview.sh "$SHA" 1200)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter web-e2e exec playwright install --with-deps chromium

      - name: Pick the run id
        run: |
          run_id=$(node -e 'const [id, attempt] = process.argv.slice(1).map(BigInt); console.log(((id * 100n + attempt) % 36n ** 6n).toString(36).padStart(6, "0"))' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          echo "E2E_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Playwright
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_LOGIN_SECRET: ${{ secrets.E2E_LOGIN_SECRET }}
          DEPLOYMENT_URL: ${{ steps.target.outputs.url }}
        run: |
          case "$DEPLOYMENT_URL" in
            http://* | https://*) E2E_BASE_URL="$DEPLOYMENT_URL" ;;
            *) E2E_BASE_URL="https://$DEPLOYMENT_URL" ;;
          esac
          echo "Testing $E2E_BASE_URL at $SHA with the run id $E2E_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          E2E_BASE_URL="$E2E_BASE_URL" pnpm run test:e2e

      - name: Summarize the results
        if: ${{ !cancelled() }}
        shell: bash
        run: node .e2e-workflow/.github/scripts/e2e-summary.mjs apps/web-e2e/.playwright-results/results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: ${{ !cancelled() && hashFiles('apps/web-e2e/playwright-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: apps/web-e2e/playwright-report/
          retention-days: 14

      - name: Report the result on the commit
        if: ${{ (success() || failure()) && env.SHA != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='The preview deployment passed'
          else
            state=failure
            description='The preview deployment failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='E2E tests' \
            -f description="$description" \
            -f target_url="$RUN_URL"
