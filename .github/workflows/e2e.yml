name: E2E

on:
  workflow_call:
    inputs:
      sha:
        description: Commit whose preview deployment to test
        required: true
        type: string
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      E2E_LOGIN_SECRET:
        required: false
      TWITCH_EVENTSUB_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      url:
        description: URL of the preview deployment to test
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  statuses: write

jobs:
  e2e:
    name: Playwright ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}/3
      SHA: ${{ inputs.sha || github.sha }}
      DEPLOYMENT_URL: ${{ inputs.url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check the deployment and the secrets
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_LOGIN_SECRET: ${{ secrets.E2E_LOGIN_SECRET }}
        run: |
          failed=0
          if [ -z "$SHA" ]; then
            echo "::error::No commit to test."
            failed=1
          fi
          for name in VERCEL_AUTOMATION_BYPASS_SECRET E2E_LOGIN_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret in Settings > Secrets and variables > Actions."
              failed=1
            fi
          done
          exit $failed

      - name: Report a pending status on the commit
        if: ${{ matrix.shard == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            description='Testing the preview deployment'
          else
            description='Waiting for the preview deployment'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context='E2E tests' \
            -f description="$description" \
            -f target_url="$RUN_URL"

      - name: Check out the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: ${{ inputs.url && '1' || '0' }}
          persist-credentials: false

      - name: Check out the scripts of the workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .e2e-workflow
          sparse-checkout: |
            .github/scripts/same-app-preview.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Start waiting for the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/preview"
          mkdir -p "$dir"
          echo "PREVIEW_DIR=$dir" >> "$GITHUB_ENV"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "$DEPLOYMENT_URL" > "$dir/url"
            : > "$dir/log"
            echo 0 > "$dir/status"
            exit 0
          fi
          (
            status=0
            bash .e2e-workflow/.github/scripts/same-app-preview.sh "$SHA" 1200 > "$dir/url" 2> "$dir/log" || status=$?
            echo "$status" > "$dir/status.tmp"
            mv "$dir/status.tmp" "$dir/status"
          ) > /dev/null 2>&1 &

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter web-e2e exec playwright install --with-deps chromium

      - name: Pick the run id
        run: |
          run_id=$(node -e 'const [id, attempt, shard] = process.argv.slice(1).map(BigInt); console.log((((id * 100n + attempt) * 10n + shard) % 36n ** 6n).toString(36).padStart(6, "0"))' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.shard }}")
          echo "E2E_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Pick the deployment to test
        id: target
        run: |
          tail -n +1 -f "$PREVIEW_DIR/log" &
          tail_pid=$!
          while [ ! -f "$PREVIEW_DIR/status" ]; do
            sleep 2
          done
          sleep 1
          kill "$tail_pid"
          status=$(cat "$PREVIEW_DIR/status")
          if [ "$status" != 0 ]; then
            exit "$status"
          fi
          echo "url=$(cat "$PREVIEW_DIR/url")" >> "$GITHUB_OUTPUT"

      - name: Playwright
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_LOGIN_SECRET: ${{ secrets.E2E_LOGIN_SECRET }}
          TWITCH_EVENTSUB_SECRET: ${{ secrets.TWITCH_EVENTSUB_SECRET }}
          DEPLOYMENT_URL: ${{ steps.target.outputs.url }}
        run: |
          case "$DEPLOYMENT_URL" in
            http://* | https://*) E2E_BASE_URL="$DEPLOYMENT_URL" ;;
            *) E2E_BASE_URL="https://$DEPLOYMENT_URL" ;;
          esac
          echo "Testing $E2E_BASE_URL at $SHA, shard $SHARD, with the run id $E2E_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          E2E_BASE_URL="$E2E_BASE_URL" pnpm --filter web-e2e exec playwright test --shard="$SHARD" --workers=8

      - name: Upload the JSON report
        if: ${{ !cancelled() && hashFiles('apps/web-e2e/.playwright-results/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/web-e2e/.playwright-results/results.json
          include-hidden-files: true
          overwrite: true
          retention-days: 14

      - name: Upload the Playwright report
        if: ${{ !cancelled() && hashFiles('apps/web-e2e/playwright-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: apps/web-e2e/playwright-report/
          retention-days: 14

  report:
    name: Report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      SHA: ${{ inputs.sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the summary script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/e2e-summary.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the JSON reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: results

      - name: Summarize the results
        shell: bash
        run: node .github/scripts/e2e-summary.mjs results/e2e-results-{1,2,3}/results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report the result on the commit
        if: ${{ env.SHA != '' && needs.e2e.result != 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$RESULT" = success ]; then
            state=success
            description='The preview deployment passed'
          else
            state=failure
            description='The preview deployment failed'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='E2E tests' \
            -f description="$description" \
            -f target_url="$RUN_URL"
