name: CI

on:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      skip-cache:
        description: Run every task again instead of reading its result from the Nx cache
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}
  NX_SKIP_NX_CACHE: ${{ inputs.skip-cache && 'true' || 'false' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - name: Stop when the last nightly run tested this commit
        id: unchanged
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tested=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""'); then
            echo "::warning::Could not read the earlier nightly runs, so this run checks everything."
            tested=
          fi
          if [ "$tested" = "$GITHUB_SHA" ]; then
            echo "The last successful nightly run already tested $GITHUB_SHA, the current commit of main. Nothing to check." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the code
        if: steps.unchanged.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        id: setup
        if: steps.unchanged.outputs.skip != 'true'
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        if: steps.unchanged.outputs.skip != 'true'
        uses: ./.github/actions/nx-cache

      - name: List the files that the pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          git diff -z --name-only --diff-filter=d "$NX_BASE" "$NX_HEAD" > "$RUNNER_TEMP/changed-files"
          if git diff --quiet "$NX_BASE" "$NX_HEAD" -- . ':!apps' ':!packages' ':!tools' &&
            git diff --quiet "$NX_BASE" "$NX_HEAD" -- packages/tooling/eslint-config; then
            echo "lint-root=false" >> "$GITHUB_OUTPUT"
          else
            echo "lint-root=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$NX_BASE" "$NX_HEAD" -- .prettierignore '.prettierrc*' 'prettier.config.*' .editorconfig &&
            [ "$(git show "$NX_BASE:package.json" | jq -c .prettier)" = "$(jq -c .prettier package.json)" ] &&
            [ "$(git show "$NX_BASE:pnpm-lock.yaml" | grep '^  prettier@')" = "$(grep '^  prettier@' pnpm-lock.yaml)" ]; then
            echo "prettier=changed" >> "$GITHUB_OUTPUT"
          else
            echo "prettier=all" >> "$GITHUB_OUTPUT"
          fi

      - name: ESLint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm nx $NX_RUN -t lint --output-style=static --quiet

      - name: ESLint (files outside the projects)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.changes.outputs.lint-root != 'false' }}
        run: pnpm run lint:root --quiet

      - name: Prettier
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          SCOPE: ${{ steps.changes.outputs.prettier || 'all' }}
        run: |
          if [ "$SCOPE" = changed ]; then
            echo "Prettier checks the files that the pull request changes."
            xargs -0 -r pnpm exec prettier --check --ignore-unknown < "$RUNNER_TEMP/changed-files"
          else
            pnpm run format:check
          fi

      - name: TypeScript
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm nx $NX_RUN -t type-check --output-style=static

      - name: Vitest server tests
        id: server
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          coverage=()
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            coverage=(-- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/server.json)
          fi
          pnpm nx $NX_RUN -t test:server --output-style=static "${coverage[@]}"

      - name: Vitest frontend tests
        id: frontend
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          coverage=()
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            coverage=(-- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/frontend.json)
          fi
          pnpm nx $NX_RUN -t test:frontend --output-style=static "${coverage[@]}"

      - name: Vitest snapshots
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm nx $NX_RUN -t test:snapshot --output-style=static

      - name: Vitest visual tests in the Playwright image
        id: visual
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm nx $NX_RUN -t test:visual:docker --output-style=static

      - name: Vitest integration tests against Postgres in Docker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm nx $NX_RUN -t test:integration --output-style=static

      - name: Merge the coverage
        id: coverage
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.server.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: |
          node .github/scripts/collect-vitest-reports.mjs server
          node .github/scripts/collect-vitest-reports.mjs frontend
          pnpm exec vitest run --merge-reports=.vitest-reports --coverage --passWithNoTests
          lines=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${lines}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the screenshots that changed
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-changes
          path: |
            apps/*/.vitest-attachments/
            packages/*/*/.vitest-attachments/
            packages/*/*/*/.vitest-attachments/
          include-hidden-files: true
          retention-days: 14

      - name: Explain how to review the changes
        if: ${{ !cancelled() && steps.visual.outcome == 'failure' }}
        run: |
          {
            echo "## Visual changes"
            echo
            echo "These screenshots do not match their references:"
            echo
            find apps packages -name node_modules -prune -o -path '*/.vitest-attachments/*' -name '*-actual-*.png' -print | sort | sed -e 's|/\.vitest-attachments/|/|' -e 's|^|- |' -e 's|-actual-|-|'
            echo
            echo "The \`visual-changes\` artifact of this run has the actual screenshot and a diff image for each one. The diff image shows the changed pixels in red."
            echo
            echo "- If the change is intended, update the references: run the **Update visual references** workflow on this branch, or run \`pnpm run test:visual:docker:update\` and commit the result. Then review the new images in the pull request."
            echo "- If the change is not intended, fix the code."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the Nx cache
        if: always() && steps.nx-cache.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  badge:
    name: Coverage badge
    if: github.ref == 'refs/heads/main' && needs.ci.outputs.coverage != ''
    needs: ci
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the badge to the badges branch
        env:
          COVERAGE: ${{ needs.ci.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=red
          if awk "BEGIN { exit !($COVERAGE >= 50) }"; then color=yellow; fi
          if awk "BEGIN { exit !($COVERAGE >= 80) }"; then color=brightgreen; fi
          mkdir badges
          cd badges
          curl --fail --silent --show-error --location --retry 3 \
            --output coverage.svg \
            "https://img.shields.io/badge/coverage-${COVERAGE}%25-${color}"
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init --quiet --initial-branch badges
          git add coverage.svg vercel.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'update coverage badge'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
