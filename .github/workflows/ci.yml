name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: ESLint
        run: pnpm run lint --quiet

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Vitest with coverage
        run: pnpm run test:coverage

      - name: Report the line coverage
        id: coverage
        run: |
          lines=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${lines}%" >> "$GITHUB_STEP_SUMMARY"

  snapshot:
    name: Snapshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Vitest snapshots
        run: pnpm run test:snapshot

  badge:
    name: Coverage badge
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the badge to the badges branch
        env:
          COVERAGE: ${{ needs.test.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=red
          if awk "BEGIN { exit !($COVERAGE >= 50) }"; then color=yellow; fi
          if awk "BEGIN { exit !($COVERAGE >= 80) }"; then color=brightgreen; fi
          mkdir badges
          cd badges
          curl --fail --silent --show-error --location --retry 3 \
            --output coverage.svg \
            "https://img.shields.io/badge/coverage-${COVERAGE}%25-${color}"
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init --quiet --initial-branch badges
          git add coverage.svg vercel.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'update coverage badge'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_asHRya24u30lgmkzXsKG5yjM
      VERCEL_PROJECT_ID: prj_VOa01RYBNPYCob5bOQHXYiI1bxRA
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the Vercel CLI
        run: npm install --global vercel@62.1.0

      - name: Deploy to Vercel production
        id: deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN secret is not set, so production was not deployed."
            exit 1
          fi
          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to production: $url" >> "$GITHUB_STEP_SUMMARY"
