name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache

      - name: ESLint
        run: pnpm nx $NX_RUN -t lint --output-style=static --quiet

      - name: Package map
        run: node docs/monorepo/check-package-map.mjs

  type-check:
    name: Type check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache

      - name: TypeScript
        run: pnpm nx $NX_RUN -t type-check --output-style=static

  server:
    name: Server tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache

      - name: Vitest server tests with coverage
        run: pnpm nx $NX_RUN -t test:server --output-style=static -- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/server.json

      - name: Collect the test reports
        run: node .github/scripts/collect-vitest-reports.mjs server

      - name: Upload the test reports
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-server
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache

      - name: Vitest frontend tests with coverage
        run: pnpm nx $NX_RUN -t test:frontend --output-style=static -- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/frontend.json

      - name: Collect the test reports
        run: node .github/scripts/collect-vitest-reports.mjs frontend

      - name: Upload the test reports
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-frontend
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage
    needs: [server, frontend]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Download the test reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-*
          path: .vitest-reports
          merge-multiple: true

      - name: Check for test reports
        id: reports
        run: |
          if [ -n "$(ls -A .vitest-reports 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No project with tests is affected, so there is no coverage to merge." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge the coverage
        if: steps.reports.outputs.found == 'true'
        run: pnpm exec vitest run --merge-reports=.vitest-reports --coverage --passWithNoTests

      - name: Report the line coverage
        if: steps.reports.outputs.found == 'true'
        id: coverage
        run: |
          lines=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${lines}%" >> "$GITHUB_STEP_SUMMARY"

  snapshot:
    name: Snapshot tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache

      - name: Vitest snapshots
        run: pnpm nx $NX_RUN -t test:snapshot --output-style=static

  playwright:
    name: Playwright version
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the lockfile
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Read the Playwright version from the lockfile
        id: version
        run: |
          version=$(grep -m1 -oP "^  playwright@\K[0-9.]+(?=:)" pnpm-lock.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual tests
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trust the checkout in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set the base and head commits for nx affected
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Vitest visual tests
        run: pnpm nx $NX_RUN -t test:visual --output-style=static

      - name: Upload the screenshots that changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-changes
          path: |
            apps/*/.vitest-attachments/
            packages/*/*/.vitest-attachments/
            packages/*/*/*/.vitest-attachments/
          include-hidden-files: true
          retention-days: 14

      - name: Explain how to review the changes
        if: failure()
        run: |
          {
            echo "## Visual changes"
            echo
            echo "These screenshots do not match their references:"
            echo
            find apps packages -name node_modules -prune -o -path '*/.vitest-attachments/*' -name '*-actual-*.png' -print | sort | sed -e 's|/\.vitest-attachments/|/|' -e 's|^|- |' -e 's|-actual-|-|'
            echo
            echo "The \`visual-changes\` artifact of this run has the actual screenshot and a diff image for each one. The diff image shows the changed pixels in red."
            echo
            echo "- If the change is intended, update the references: run the **Update visual references** workflow on this branch, or run \`pnpm run test:visual:docker:update\` and commit the result. Then review the new images in the pull request."
            echo "- If the change is not intended, fix the code."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  badge:
    name: Coverage badge
    if: github.event_name == 'push'
    needs: coverage
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the badge to the badges branch
        env:
          COVERAGE: ${{ needs.coverage.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=red
          if awk "BEGIN { exit !($COVERAGE >= 50) }"; then color=yellow; fi
          if awk "BEGIN { exit !($COVERAGE >= 80) }"; then color=brightgreen; fi
          mkdir badges
          cd badges
          curl --fail --silent --show-error --location --retry 3 \
            --output coverage.svg \
            "https://img.shields.io/badge/coverage-${COVERAGE}%25-${color}"
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init --quiet --initial-branch badges
          git add coverage.svg vercel.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'update coverage badge'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
