name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: Run every task again instead of reading its result from the Nx cache
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true
  NX_RUN: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'run-many' }}
  NX_SKIP_NX_CACHE: ${{ inputs.skip-cache && 'true' || 'false' }}

jobs:
  lint:
    name: Lint ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        id: setup
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache
        with:
          id: lint-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs lint ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: ESLint
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t lint --projects="$PROJECTS" --output-style=static --quiet

      - name: ESLint (files outside the projects)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.shard == 1 }}
        run: pnpm run lint:root --quiet

      - name: Prettier
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.shard == 1 }}
        run: pnpm run format:check

  type-check:
    name: Type check ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache
        with:
          id: type-check-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs type-check ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: TypeScript
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t type-check --projects="$PROJECTS" --output-style=static

  server:
    name: Server tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache
        with:
          id: server-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:server ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest server tests with coverage
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:server --projects="$PROJECTS" --output-style=static -- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/server.json

      - name: Collect the test reports
        if: steps.projects.outputs.projects
        run: node .github/scripts/collect-vitest-reports.mjs server

      - name: Upload the test reports
        if: steps.projects.outputs.projects
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-server-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  frontend:
    name: Frontend tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache
        with:
          id: frontend-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:frontend ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest frontend tests with coverage
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:frontend --projects="$PROJECTS" --output-style=static -- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/frontend.json

      - name: Collect the test reports
        if: steps.projects.outputs.projects
        run: node .github/scripts/collect-vitest-reports.mjs frontend

      - name: Upload the test reports
        if: steps.projects.outputs.projects
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-frontend-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage
    needs: [server, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the test reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-*
          path: .vitest-reports
          merge-multiple: true

      - name: Check for test reports
        id: reports
        run: |
          if [ -n "$(ls -A .vitest-reports 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No project with tests is affected, so there is no coverage to merge." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Node.js
        if: steps.reports.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install only Vitest and its coverage provider
        if: steps.reports.outputs.found == 'true'
        run: |
          vitest=$(sed -n -E 's/^  vitest@([0-9.]+):$/\1/p' pnpm-lock.yaml | head -n 1)
          provider=$(sed -n -E "s/^  '@vitest\/coverage-v8@([0-9.]+)':$/\1/p" pnpm-lock.yaml | head -n 1)
          if [ -z "$vitest" ] || [ -z "$provider" ]; then
            echo "::error::Cannot read the versions of vitest and @vitest/coverage-v8 from pnpm-lock.yaml"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/coverage"
          echo '{ "private": true }' > "$RUNNER_TEMP/coverage/package.json"
          npm install --prefix "$RUNNER_TEMP/coverage" --no-audit --no-fund "vitest@$vitest" "@vitest/coverage-v8@$provider"
          ln -s "$RUNNER_TEMP/coverage/node_modules" node_modules

      - name: Merge the coverage
        if: steps.reports.outputs.found == 'true'
        run: node node_modules/vitest/vitest.mjs run --config vitest.coverage.config.ts --merge-reports=.vitest-reports --coverage --passWithNoTests

      - name: Report the line coverage
        if: steps.reports.outputs.found == 'true'
        id: coverage
        run: |
          lines=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${lines}%" >> "$GITHUB_STEP_SUMMARY"

  snapshot:
    name: Snapshot tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        uses: ./.github/actions/nx-cache
        with:
          id: snapshot-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:snapshot ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest snapshots
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:snapshot --projects="$PROJECTS" --output-style=static

  visual:
    name: Visual tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:visual:docker ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest visual tests in the Playwright image
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:visual:docker --projects="$PROJECTS" --output-style=static

      - name: Upload the screenshots that changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-changes-${{ matrix.shard }}
          path: |
            apps/*/.vitest-attachments/
            packages/*/*/.vitest-attachments/
            packages/*/*/*/.vitest-attachments/
          include-hidden-files: true
          retention-days: 14

      - name: Explain how to review the changes
        if: failure()
        env:
          ARTIFACT: visual-changes-${{ matrix.shard }}
        run: |
          {
            echo "## Visual changes"
            echo
            echo "These screenshots do not match their references:"
            echo
            find apps packages -name node_modules -prune -o -path '*/.vitest-attachments/*' -name '*-actual-*.png' -print | sort | sed -e 's|/\.vitest-attachments/|/|' -e 's|^|- |' -e 's|-actual-|-|'
            echo
            echo "The \`$ARTIFACT\` artifact of this run has the actual screenshot and a diff image for each one. The diff image shows the changed pixels in red."
            echo
            echo "- If the change is intended, update the references: run the **Update visual references** workflow on this branch, or run \`pnpm run test:visual:docker:update\` and commit the result. Then review the new images in the pull request."
            echo "- If the change is not intended, fix the code."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:integration ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest integration tests against Postgres in Docker
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:integration --projects="$PROJECTS" --output-style=static

  mutation:
    name: Mutation tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Stryker on the changed lines
        run: pnpm run test:mutation:changed

      - name: Upload the mutation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: Checks
    needs:
      - lint
      - type-check
      - server
      - frontend
      - snapshot
      - visual
      - integration
      - mutation
      - coverage
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $failed. The log of each failed shard names the check that failed."
            exit 1
          fi

  badge:
    name: Coverage badge
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: coverage
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the badge to the badges branch
        env:
          COVERAGE: ${{ needs.coverage.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=red
          if awk "BEGIN { exit !($COVERAGE >= 50) }"; then color=yellow; fi
          if awk "BEGIN { exit !($COVERAGE >= 80) }"; then color=brightgreen; fi
          mkdir badges
          cd badges
          curl --fail --silent --show-error --location --retry 3 \
            --output coverage.svg \
            "https://img.shields.io/badge/coverage-${COVERAGE}%25-${color}"
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init --quiet --initial-branch badges
          git add coverage.svg vercel.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'update coverage badge'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
