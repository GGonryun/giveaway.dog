name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-cache:
        description: Run every task again instead of reading its result from the Nx cache
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}
  NX_SKIP_NX_CACHE: ${{ inputs.skip-cache && 'true' || 'false' }}

jobs:
  lint:
    name: Lint ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        id: setup
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        uses: ./.github/actions/nx-cache
        with:
          id: lint-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs lint ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: ESLint
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t lint --projects="$PROJECTS" --output-style=static --quiet

      - name: ESLint (files outside the projects)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.shard == 1 }}
        run: pnpm run lint:root --quiet

      - name: Prettier
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.shard == 1 }}
        run: pnpm run format:check

      - name: Save the Nx cache
        if: ${{ !cancelled() && steps.nx-cache.outcome == 'success' && steps.nx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  type-check:
    name: Type check ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        uses: ./.github/actions/nx-cache
        with:
          id: type-check-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs type-check ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: TypeScript
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t type-check --projects="$PROJECTS" --parallel=4 --output-style=static

      - name: Save the Nx cache
        if: ${{ !cancelled() && steps.nx-cache.outcome == 'success' && steps.nx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  server:
    name: Server tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        uses: ./.github/actions/nx-cache
        with:
          id: server-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:server ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest server tests with coverage
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:server --projects="$PROJECTS" --output-style=static -- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/server.json --reporter=json --outputFile.json=.vitest-results/server.json

      - name: Count the tests
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        run: node .github/scripts/count-tests.mjs server ${{ matrix.shard }}

      - name: Upload the test counts
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-server-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

      - name: Collect the test reports
        if: steps.projects.outputs.projects
        run: node .github/scripts/collect-vitest-reports.mjs server

      - name: Upload the test reports
        if: steps.projects.outputs.projects
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-server-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

      - name: Save the Nx cache
        if: ${{ !cancelled() && steps.nx-cache.outcome == 'success' && steps.nx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  property:
    name: Property tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        uses: ./.github/actions/nx-cache
        with:
          id: property-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:property ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest property tests with coverage
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:property --projects="$PROJECTS" --output-style=static -- --coverage --coverage.reportsDirectory=coverage/property --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/property.json --reporter=json --outputFile.json=.vitest-results/property.json

      - name: Count the tests
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        run: node .github/scripts/count-tests.mjs property ${{ matrix.shard }}

      - name: Upload the test counts
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-property-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

      - name: Collect the test reports
        if: steps.projects.outputs.projects
        run: node .github/scripts/collect-vitest-reports.mjs property

      - name: Upload the test reports
        if: steps.projects.outputs.projects
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-property-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

      - name: Report the property coverage
        if: steps.projects.outputs.projects
        id: coverage
        continue-on-error: true
        run: node .github/scripts/property-coverage.mjs

      - name: Save the Nx cache
        if: ${{ !cancelled() && steps.nx-cache.outcome == 'success' && steps.nx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  frontend:
    name: Frontend tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        uses: ./.github/actions/nx-cache
        with:
          id: frontend-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:frontend ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest frontend tests with coverage
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:frontend --projects="$PROJECTS" --output-style=static -- --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/frontend.json --reporter=json --outputFile.json=.vitest-results/frontend.json

      - name: Count the tests
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        run: node .github/scripts/count-tests.mjs frontend ${{ matrix.shard }}

      - name: Upload the test counts
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

      - name: Collect the test reports
        if: steps.projects.outputs.projects
        run: node .github/scripts/collect-vitest-reports.mjs frontend

      - name: Upload the test reports
        if: steps.projects.outputs.projects
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-frontend-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

      - name: Save the Nx cache
        if: ${{ !cancelled() && steps.nx-cache.outcome == 'success' && steps.nx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  coverage:
    name: Coverage
    needs: [server, property, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      coverage: ${{ steps.coverage.outputs.all }}
      server: ${{ steps.coverage.outputs.server }}
      frontend: ${{ steps.coverage.outputs.frontend }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the test reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-*
          path: .vitest-reports/all
          merge-multiple: true

      - name: Download the server test reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-server-*
          path: .vitest-reports/server
          merge-multiple: true

      - name: Download the frontend test reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-frontend-*
          path: .vitest-reports/frontend
          merge-multiple: true

      - name: Check for test reports
        id: reports
        run: |
          if [ -n "$(ls -A .vitest-reports/all 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No project with tests is affected, so there is no coverage to merge." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Node.js
        if: steps.reports.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install only Vitest and its coverage provider
        if: steps.reports.outputs.found == 'true'
        run: |
          vitest=$(sed -n -E 's/^  vitest@([0-9.]+):$/\1/p' pnpm-lock.yaml | head -n 1)
          provider=$(sed -n -E "s/^  '@vitest\/coverage-v8@([0-9.]+)':$/\1/p" pnpm-lock.yaml | head -n 1)
          if [ -z "$vitest" ] || [ -z "$provider" ]; then
            echo "::error::Cannot read the versions of vitest and @vitest/coverage-v8 from pnpm-lock.yaml"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/coverage"
          echo '{ "private": true }' > "$RUNNER_TEMP/coverage/package.json"
          npm install --prefix "$RUNNER_TEMP/coverage" --no-audit --no-fund "vitest@$vitest" "@vitest/coverage-v8@$provider"
          ln -s "$RUNNER_TEMP/coverage/node_modules" node_modules

      - name: Merge the coverage
        if: steps.reports.outputs.found == 'true'
        run: |
          for kind in all server frontend; do
            if [ -n "$(ls -A ".vitest-reports/$kind" 2>/dev/null)" ]; then
              node node_modules/vitest/vitest.mjs run --config vitest.coverage.config.ts --merge-reports=".vitest-reports/$kind" --coverage --coverage.reportsDirectory="coverage/$kind" --passWithNoTests
            fi
          done

      - name: Report the line coverage
        if: steps.reports.outputs.found == 'true'
        id: coverage
        run: |
          {
            echo "| Tests | Line coverage |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for kind in all server frontend; do
            summary="coverage/$kind/coverage-summary.json"
            if [ -f "$summary" ]; then
              lines=$(node -p "require('./$summary').total.lines.pct")
              echo "$kind=$lines" >> "$GITHUB_OUTPUT"
              echo "| $kind | ${lines}% |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  snapshot:
    name: Snapshot tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Set up the Nx cache
        id: nx-cache
        uses: ./.github/actions/nx-cache
        with:
          id: snapshot-${{ matrix.shard }}-of-${{ strategy.job-total }}

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:snapshot ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest snapshots
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:snapshot --projects="$PROJECTS" --output-style=static -- --reporter=default --reporter=json --outputFile.json=.vitest-results/snapshot.json

      - name: Count the tests
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        run: node .github/scripts/count-tests.mjs snapshot ${{ matrix.shard }}

      - name: Upload the test counts
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-snapshot-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

      - name: Save the Nx cache
        if: ${{ !cancelled() && steps.nx-cache.outcome == 'success' && steps.nx-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .nx/ci-cache
          key: ${{ steps.nx-cache.outputs.key }}

  visual:
    name: Visual tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:visual:docker ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest visual tests in the Playwright image
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:visual:docker --projects="$PROJECTS" --output-style=static -- --reporter=default --reporter=json --outputFile.json=.vitest-results/visual.json

      - name: Count the tests
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        run: node .github/scripts/count-tests.mjs visual ${{ matrix.shard }}

      - name: Upload the test counts
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-visual-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

      - name: Upload the screenshots that changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-changes-${{ matrix.shard }}
          path: |
            apps/*/.vitest-attachments/
            packages/*/*/.vitest-attachments/
            packages/*/*/*/.vitest-attachments/
          include-hidden-files: true
          retention-days: 14

      - name: Explain how to review the changes
        if: failure()
        env:
          ARTIFACT: visual-changes-${{ matrix.shard }}
        run: |
          {
            echo "## Visual changes"
            echo
            echo "These screenshots do not match their references:"
            echo
            find apps packages -name node_modules -prune -o -path '*/.vitest-attachments/*' -name '*-actual-*.png' -print | sort | sed -e 's|/\.vitest-attachments/|/|' -e 's|^|- |' -e 's|-actual-|-|'
            echo
            echo "The \`$ARTIFACT\` artifact of this run has the actual screenshot and a diff image for each one. The diff image shows the changed pixels in red."
            echo
            echo "- If the change is intended, update the references: run the **Update visual references** workflow on this branch, or run \`pnpm run test:visual:docker:update\` and commit the result. Then review the new images in the pull request."
            echo "- If the change is not intended, fix the code."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits for nx affected
        if: env.NX_RUN == 'affected'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Select the projects of this shard
        id: projects
        run: node .github/scripts/select-shard-projects.mjs test:integration ${{ matrix.shard }} ${{ strategy.job-total }}

      - name: Vitest integration tests against Postgres in Docker
        if: steps.projects.outputs.projects
        env:
          PROJECTS: ${{ steps.projects.outputs.projects }}
        run: pnpm nx run-many -t test:integration --projects="$PROJECTS" --output-style=static -- --reporter=default --reporter=json --outputFile.json=.vitest-results/integration.json

      - name: Count the tests
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        run: node .github/scripts/count-tests.mjs integration ${{ matrix.shard }}

      - name: Upload the test counts
        if: ${{ !cancelled() && steps.projects.outputs.projects }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-${{ matrix.shard }}
          path: test-results/
          retention-days: 1

  mutation:
    name: Mutation tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      checked: ${{ steps.gate.outputs.checked }}
      killed: ${{ steps.gate.outputs.killed }}
      failed: ${{ steps.gate.outputs.failed }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set the base and head commits of the changed lines
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@v5

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Stryker on the changed lines
        id: gate
        run: pnpm run test:mutation:changed

      - name: Upload the mutation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: Checks
    needs:
      - lint
      - type-check
      - server
      - property
      - frontend
      - snapshot
      - visual
      - integration
      - mutation
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $failed. The log of each failed shard names the check that failed."
            exit 1
          fi

  badges:
    name: Badges
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs:
      - server
      - property
      - frontend
      - snapshot
      - visual
      - integration
      - mutation
      - coverage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: read
      statuses: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the test counts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Read the E2E result of the merged pull request
        id: e2e
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
          state=
          if [ -n "$head" ]; then
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" --jq '[.statuses[] | select(.context == "E2E tests")][0].state // empty')
          fi
          echo "E2E tests of ${head:-no merged pull request}: ${state:-no result}"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish the badges and the history to the badges branch
        env:
          NEEDS: ${{ toJSON(needs) }}
          COVERAGE: ${{ needs.coverage.outputs.coverage }}
          SERVER_COVERAGE: ${{ needs.coverage.outputs.server }}
          FRONTEND_COVERAGE: ${{ needs.coverage.outputs.frontend }}
          PROPERTY_COVERAGE: ${{ needs.property.outputs.coverage }}
          E2E: ${{ steps.e2e.outputs.state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch badges "$RUNNER_TEMP/badges"
          cd "$RUNNER_TEMP/badges"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --quiet origin badges
            git checkout --quiet -B badges FETCH_HEAD
          fi
          cd "$GITHUB_WORKSPACE"
          node .github/scripts/badges.mjs "$RUNNER_TEMP/badges" test-results
          cd "$RUNNER_TEMP/badges"
          rm -f coverage.svg property-coverage.svg
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git add --all
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "Badges of ${GITHUB_SHA::7}"
          git push --quiet origin badges
