name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: ESLint
        run: pnpm run lint --quiet

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Vitest server tests with coverage
        run: pnpm run test:server --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/server.json

      - name: Upload the test report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-server
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Vitest frontend tests with coverage
        run: pnpm run test:frontend --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/frontend.json

      - name: Upload the test report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-frontend
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage
    needs: [server, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.lines }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Download the test reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge the coverage
        run: pnpm vitest run --merge-reports=.vitest-reports --coverage

      - name: Report the line coverage
        id: coverage
        run: |
          lines=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${lines}%" >> "$GITHUB_STEP_SUMMARY"

  snapshot:
    name: Snapshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the project
        uses: ./.github/actions/setup

      - name: Vitest snapshots
        run: pnpm run test:snapshot

  badge:
    name: Coverage badge
    if: github.event_name == 'push'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the badge to the badges branch
        env:
          COVERAGE: ${{ needs.coverage.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=red
          if awk "BEGIN { exit !($COVERAGE >= 50) }"; then color=yellow; fi
          if awk "BEGIN { exit !($COVERAGE >= 80) }"; then color=brightgreen; fi
          mkdir badges
          cd badges
          curl --fail --silent --show-error --location --retry 3 \
            --output coverage.svg \
            "https://img.shields.io/badge/coverage-${COVERAGE}%25-${color}"
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init --quiet --initial-branch badges
          git add coverage.svg vercel.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'update coverage badge'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
